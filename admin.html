<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin PDF Vault</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="logo">PDF<span>Vault</span> · Admin</div><a href="/logout">Esci</a></header><main><section class="card"><h1>Carica un PDF</h1><form method="post" action="/admin/upload" enctype="multipart/form-data"><label>Titolo<input name="title" placeholder="Es. Analisi 1 - Appunti"></label><label>PDF<input type="file" name="pdf" accept="application/pdf" required></label><label>Password del documento<input name="pdfPassword" type="password" minlength="4" required></label><button>Carica e proteggi</button></form></section><section><h2>Documenti</h2><div id="docs"></div></section></main><script>fetch('/api/documents').then(r=>r.json()).then(d=>{docs.innerHTML=d.map(v=>`<div class="row"><span>${v.title}</span><form method="post" action="/admin/delete/${v.id}"><button class="danger">Elimina</button></form></div>`).join('')||'<p>Nessun PDF.</p>'})</script></body></html>
