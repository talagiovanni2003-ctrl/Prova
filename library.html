<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I tuoi PDF</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="logo">PDF<span>Vault</span></div><a href="/logout">Esci</a></header><main><h1>I tuoi documenti</h1><div id="docs" class="grid"></div></main><script>fetch('/api/documents').then(r=>r.json()).then(d=>{const x=document.getElementById('docs');x.innerHTML=d.map(v=>`<a class="doc" href="/document/${v.id}"><b>PDF</b><span>${v.title}</span></a>`).join('')||'<p>Nessun documento disponibile.</p>'})</script></body></html>
