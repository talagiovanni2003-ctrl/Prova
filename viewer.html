<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documento protetto</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><div class="logo">PDF<span>Vault</span></div><h1>Documento protetto</h1><p>Inserisci la password del documento per visualizzarlo.</p><form id="f"><input id="p" type="password" placeholder="Password del PDF" required><button>Visualizza PDF</button></form><p id="e" class="error"></p></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let r=await fetch(location.pathname+'/unlock',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(document.getElementById('p').value)});if(r.ok){let j=await r.json();location=j.url}else document.getElementById('e').textContent='Password non corretta.'}</script></body></html>
